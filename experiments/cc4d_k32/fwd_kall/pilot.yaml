name: cc4d_k32_fwd_kall_pilot
description: CC4D full-report batching, fwd, k=all.
data:
  benchmark: ../../../data/cc4d_k32_v1/fwd
  require_local_videos: true
  video_root: /home/azureuser/datasets/captaincook4d/gopro_360p
  report_ids:
  - cc4d-1_32
  - cc4d-2_28
  - cc4d-5_27
  - cc4d-12_48
  - cc4d-23_26
method:
  name: batched
  batch_size: 100
prompt:
  system: ../prompts/system.txt
  user: ../prompts/user.txt
  context_keys:
  - task_name
  - recipe
  - error_definitions
provider:
  name: gemini
  model: gemini-4-argon
  gemini:
    backend: vertex_express
    api_key_env: GEMINI_API_KEY
    clip_height: 480
    clip_fps: 2.0
    max_payload_bytes: 200000000
    base_url: https://aiplatform.googleapis.com/v1/projects/663601952811/locations/global/publishers/google/models/
video:
  use_time_range: true
  fps: 2.0
generation:
  temperature: 0.0
  max_output_tokens: 8192
  response_format: json
execution:
  concurrency: 4
  max_attempts: 3
  timeout_s: 600
pricing:
  currency: USD
  input_per_million: 2.0
  cached_input_per_million: 0.1
  output_per_million: 10.0
  source: third-party listings (litellm, dvarahq), introductory Vertex rate to 2026-11-30;
    not Google's page
