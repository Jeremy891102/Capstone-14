  require_local_videos: true
  video_root: /home/nyu-data/datasets/captaincook4d/gopro_360p
  report_ids:
  - cc4d-1_32__dur_multi_8step
  - cc4d-1_32__dur_int_8step
  - cc4d-1_32__loc_multi_8step
