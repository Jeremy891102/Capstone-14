# Live smoke test on HD-EPIC (whole-report) through OpenRouter. NOT run in tests or CI.
# Before use: pip install -e '.[openrouter]'  and  export OPENROUTER_API_KEY=...
# Report time ranges are cut into clips by ffmpeg, so the model sees clip-relative time.
# Paid calls: only run when authorized.
name: exp004_hd_epic_smoke
description: HD-EPIC manual smoke set (3 videos, 11 MCQ), whole-report Gemini.

data:
  benchmark: ../../data/hd_epic_smoke_v1
  report_ids: null
  field_ids: null
  video_root: ../../data/HD-EPIC/Videos
  require_local_videos: true    # fail at run creation if a video file is missing

method:
  name: whole_report

prompt:
  system: prompts/system.txt
  user: prompts/user.txt
  context_keys: [task_name]

provider:
  name: openrouter
  model: google/gemini-3.5-flash-lite   # id + price checked on openrouter.ai/api/v1/models
  openrouter:
    api_key_env: OPENROUTER_API_KEY
    clip_height: 480
    clip_fps: 2.0

generation:
  temperature: 0.0
  max_output_tokens: 1024
  response_format: json

video:
  fps: null                # null = provider default; (0, 24] sends VideoMetadata.fps
  use_time_range: true     # report time ranges -> VideoMetadata start/end offsets

execution:
  concurrency: 2
  timeout_s: 300
  max_attempts: 3
  backoff_initial_s: 5.0
  backoff_max_s: 60.0
  backoff_jitter: 0.25

pricing:
  input_per_million: 0.30
  output_per_million: 2.50
  source: openrouter.ai/api/v1/models, google/gemini-3.5-flash-lite, checked 2026-10-06
