name: hd_epic_argon_novideo_k16
description: HD-EPIC no-video control for the Argon batching curve, k=16. Same calls (questions, order,
  grouping) as the Argon baseline in results/hd_epic_q40_v1_four_model_baseline_20261110; no video is sent.
data:
  benchmark: ../../../data/hd_epic_argon_novideo_v1/k16
  require_local_videos: false
method:
  name: batched
  batch_size: 16
prompt:
  system: ../prompts/system.txt
  user: ../prompts/user.txt
  context_keys:
  - task_name
provider:
  name: gemini
  model: gemini-4-argon
  gemini:
    backend: vertex_express
    api_key_env: GEMINI_API_KEY
    clip_height: 480
    clip_fps: 2.0
    base_url: https://aiplatform.googleapis.com/v1/projects/663601952811/locations/global/publishers/google/models/
video:
  use_time_range: true
  fps: 2.0
  enabled: false
generation:
  # matches the Argon baseline: MEDIUM thinking, 32,768 output tokens, JSON (no temperature was set there)
  temperature: null
  max_output_tokens: 32768
  thinking_level: MEDIUM
  response_format: json
execution:
  concurrency: 8
  max_attempts: 3
  timeout_s: 600
pricing:
  currency: USD
  input_per_million: 2.0
  cached_input_per_million: 0.1
  output_per_million: 10.0
  source: same as experiments/cc4d_k32 (third-party listings; introductory Vertex rate to 2026-11-30)
