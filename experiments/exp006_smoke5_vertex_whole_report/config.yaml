# Paid video runs require separate authorization.
name: exp006_smoke5_vertex_whole_report
description: Five-video localization smoke template; validated with Gemini in staged runs.
data:
  benchmark: ../../data/hd_epic_smoke5_loc8_v1
  require_local_videos: true
method:
  name: whole_report
prompt:
  system: prompts/system.txt
  user: prompts/user.txt
  context_keys:
  - task_name
provider:
  name: gemini
  model: gemini-3.5-flash-lite
  gemini:
    backend: vertex_express
    api_key_env: GEMINI_API_KEY
    clip_height: 480
    clip_fps: 2.0
video:
  use_time_range: true
  fps: 2.0
generation:
  temperature: 0.0
  max_output_tokens: 2048
  response_format: json
execution:
  concurrency: 1
  max_attempts: 1
  timeout_s: 300
pricing:
  currency: USD
  input_per_million: 0.3
  cached_input_per_million: 0.03
  output_per_million: 2.5
  source: https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing
    ; global standard Gemini 3.5 Flash-Lite; checked 2026-10-08
