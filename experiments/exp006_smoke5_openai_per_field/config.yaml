# Requires original videos, API key, verified pricing, and paid-run authorization.
name: exp006_smoke5_openai_per_field
description: 'Draft smoke test: 5 videos x 8 localization questions. No live API validation
  yet.'
data:
  benchmark: ../../data/hd_epic_smoke5_loc8_v1
  require_local_videos: true
method:
  name: per_field
prompt:
  system: prompts/system.txt
  user: prompts/user.txt
  context_keys:
  - task_name
provider:
  name: openai
  model: gpt-4.1-2025-04-14
  openai:
    api_key_env: OPENAI_API_KEY
    frame_height: 480
    frame_fps: 2.0
    max_frames: 1500
    image_detail: auto
video:
  use_time_range: true
  fps: 2.0
generation:
  temperature: 0.0
  max_output_tokens: 2048
  response_format: json
execution:
  concurrency: 1
  max_attempts: 1
  timeout_s: 300
pricing: null
