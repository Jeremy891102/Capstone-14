name: cc4d_oracle_argon_remaining931
description: CC4D oracle clips (step span +/- 5 s), single-step prompt, both step
  questions in one call. Video settings identical to the Argon full-report runs (experiments/cc4d_k32).
data:
  benchmark: ../../../data/cc4d_oracle_single_remaining931
  require_local_videos: true
  video_root: /home/nyu-data/argon_oracle_20261125/videos
method:
  name: batched
  batch_size: 2
prompt:
  system: ../prompts/system.txt
  user: ../prompts/user.txt
  context_keys:
  - task_name
  - step
  - error_definitions
provider:
  name: gemini
  model: gemini-4-argon
  gemini:
    backend: vertex_express
    api_key_env: GEMINI_API_KEY
    clip_height: 480
    clip_fps: 2.0
    max_payload_bytes: 200000000
    base_url: https://aiplatform.googleapis.com/v1/projects/663601952811/locations/global/publishers/google/models/
video:
  use_time_range: true
  fps: 2.0
generation:
  temperature: 0.0
  max_output_tokens: 8192
  response_format: json
execution:
  concurrency: 4
  max_attempts: 1
  timeout_s: 600
pricing:
  currency: USD
  input_per_million: 4.0
  cached_input_per_million: 0.2
  output_per_million: 20.0
  source: https://cloud.google.com/model-garden/pricing checked 2026-11-25; gross
    before conditional 50 percent credits
