name: cc4d_argon_pilot_k1
description: 'Plan A (Q1/Q6 replication): Gemini 4 Argon on base_k1, cells dur_bool,
  dur_single, loc_bool, loc_single, loc_seconds.'
data:
  benchmark: ../../../data/cc4d_answer_types_v1/base
  require_local_videos: true
  video_root: /home/azureuser/datasets/captaincook4d/gopro_360p
  report_ids:
  - cc4d-1_32__dur_bool
  - cc4d-1_32__dur_single
  - cc4d-1_32__loc_bool
  - cc4d-1_32__loc_single
