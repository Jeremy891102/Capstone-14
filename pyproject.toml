[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-report"
version = "0.1.0"
description = "Inference and evaluation harness for egocentric task video -> structured report experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Only needed for live Gemini runs. Mock runs and the default test suite do not import it.
# Developed and unit-tested against google-genai 2.28.0.
gemini = ["google-genai>=2.0"]
# Live OpenRouter runs: httpx for the API, imageio-ffmpeg bundles the ffmpeg used to cut clips.
openrouter = ["httpx>=0.27", "imageio-ffmpeg>=0.5"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
video-report = "video_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: performs real, possibly paid, provider API calls; excluded by default (run with -m live)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true
