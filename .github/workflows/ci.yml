name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Lint, type check and the offline test suite. No secrets, no network calls to model APIs.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev,gemini]'
      - name: Ruff
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Mypy
        run: mypy
      - name: Tests (offline; live tests excluded by default)
        run: pytest -q

  no-sdk:
    # Mock runs must work without the Gemini SDK installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install without the gemini extra
        run: python -m pip install -e '.[dev]'
      - name: Tests (Gemini adapter tests skip; everything else must pass)
        run: pytest -q -rs
