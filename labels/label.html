<title>Judge labeling</title>
<style>
:root{--bg:#fafaf8;--fg:#1c1c1a;--mut:#6b6b66;--card:#fff;--line:#dcdcd6;--ok:#1f7a4d;--no:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ececea;--mut:#9a9a94;--card:#202020;--line:#383836;--ok:#4cc38a;--no:#f2766e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
.bar{height:6px;background:var(--line);border-radius:3px;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
.lab{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.sec{margin-bottom:14px}.sec:last-child{margin-bottom:0}
.ref{font-weight:600}.ans{font-size:19px}
.btns{display:flex;gap:12px}.btns button{flex:1;padding:16px;font-size:18px;border-radius:10px;border:2px solid;background:var(--card);cursor:pointer;color:var(--fg)}
.y{border-color:var(--ok)}.n{border-color:var(--no)}
.small{display:flex;gap:12px;margin-top:12px;font-size:14px}.small button{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--fg);cursor:pointer}
details{font-size:14px;color:var(--mut)}kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px}
.prev{font-size:14px;color:var(--mut)}
</style></head><body><main>

<p>參考是「none」:模型只有說沒做錯才對,說出任何錯誤都錯。<br>

const KEY="judge_labels_v1";
let L={};try{L=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
let i=ROWS.findIndex(r=>!L[r.n]);if(i<0)i=ROWS.length;
function save(){try{localStorage.setItem(KEY,JSON.stringify(L))}catch(e){}}
function sec(l,t,c){const d=document.createElement("div");d.className="sec";const a=document.createElement("div");a.className="lab";a.textContent=l;const b=document.createElement("div");if(c)b.className=c;b.textContent=t;d.append(a,b);return d}
function render(){
 const done=Object.keys(L).length;
 document.getElementById("cnt").textContent=done+" / "+ROWS.length+" 已標";
 document.getElementById("bar").style.width=100*done/ROWS.length+"%";
 const c=document.getElementById("card");c.replaceChildren();
 if(i>=ROWS.length){document.getElementById("pos").textContent="完成";c.append(sec("完成","全部標完了,按「下載 CSV」。若有想改的,按 Backspace 回上一題。"));return}
 const r=ROWS[i];document.getElementById("pos").textContent="第 "+(i+1)+" 題";
 c.append(sec("題目",r.question.replace(/^Compared with the recipe, /,"")),sec("參考(真的做錯的)",r.reference,"ref"));
 if(r.note)c.append(sec("備註",r.note));
 c.append(sec("模型答案",r.answer,"ans"));
 const p=L[r.n];document.getElementById("prev").textContent=p?"目前標:"+(p==="correct"?"對":"錯"):"";
}
function mark(v){if(i>=ROWS.length)return;L[ROWS[i].n]=v;save();i++;render()}
function back(){if(i>0){i--;render()}}
function esc(s){return '"'+String(s).replace(/"/g,'""')+'"'}
function dl(){
 const h=["n","question","reference","note","answer","human"];
 const out=[h.join(",")].concat(ROWS.map(r=>[r.n,r.question,r.reference,r.note,r.answer,L[r.n]||""].map(esc).join(",")));
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out.join("\n")+"\n"],{type:"text/csv"}));a.download="judge_sheet_labeled.csv";a.click()}
document.addEventListener("keydown",e=>{if(e.key==="1")mark("correct");else if(e.key==="0")mark("incorrect");else if(e.key==="Backspace"){e.preventDefault();back()}});
render();
